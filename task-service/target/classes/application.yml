server:
  port: 8083

spring:
  application:
    name: task-service
    
  datasource:
    url: jdbc:h2:mem:taskdb
    username: sa
    password: password
    driverClassName: org.h2.Driver
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  
  h2:
    console:
      enabled: true
      path: /h2-console
      
  security:
    oauth2:
      client:
        provider:
          auth0:
            issuer-uri: https://dev-74z0i7dvek4nks11.us.auth0.com/
        registration:
          auth0:
            client-id: N5dJ2gvrCspzgpYdvKCAotIdv7mNzAhg
            client-secret: ${AUTH0_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
      resourceserver:
        jwt:
          issuer-uri: https://dev-74z0i7dvek4nks11.us.auth0.com/

auth0:
  domain: dev-74z0i7dvek4nks11.us.auth0.com
  audience: https://api.taskflow.com

okta:
  oauth2:
    issuer: https://dev-74z0i7dvek4nks11.us.auth0.com/
    client-id: N5dJ2gvrCspzgpYdvKCAotIdv7mNzAhg
    client-secret: YOUR_CLIENT_SECRET # Замените на реальный секрет из Auth0 Dashboard 